# Apex short link for expense groups: https://ai-budget.pl/g/<token> -> 302 -> api.ai-budget.pl (ABA-649).
#
# A REDIRECT, never a proxy: the guest page, its host-only cookie (Path=/g/<token> on api.ai-budget.pl)
# and the origin check all stay on the API host, so every existing guest stays identified. Only the
# token path segment is carried over (no query, no other path): there is no open redirect, the target
# host is a constant. Runbook with apply/verify/rollback: docs/ops/group-short-link.md
#
# THIS FILE IS NOT DEPLOYED BY CI. shared-nginx's config lives on the VPS (outside this repo).
# Paste both locations INSIDE the `server { server_name ai-budget.pl; ... }` (apex) block, above
# `location /`.
#
# How the two interact: a regex location beats a plain (non-^~) prefix location, so the strict token
# match wins when it fits and everything else under /g/ falls to the 404. Do NOT add ^~ to the prefix
# location: it would then beat the regex and 404 every valid link.
#
# 302 not 301 (a 301 is cached forever, which would make a later move to a proxy impossible) and not
# 307 (a stray POST becomes a GET; nothing mutates on a GET).

location /g/ {
    return 404;
}

location ~ "^/g/(?<gtoken>[A-Za-z0-9_-]{8,128})/?$" {
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    return 302 https://api.ai-budget.pl/g/$gtoken;
}

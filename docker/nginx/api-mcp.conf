# MCP connector: routes for /mcp and the OAuth discovery documents on api.ai-budget.pl.
#
# THIS FILE IS A DOCUMENT, NOT DEPLOYED BY CI, AND NOT APPLIED TO THE VPS. shared-nginx's config
# lives on the VPS (outside this repo) and serves every project on the box. Runbook with
# apply/verify/rollback: docs/ops/mcp.md. Applying it needs the owner's OK, a backup, `nginx -t`
# and a graceful reload (never recreate shared-nginx; see docs/ops/leaflets.md and
# docs/ops/api-rate-limit.md "Applying a change": no `sed -i` on a bind-mounted file).
#
# PREREQUISITE: docker/nginx/api-public.conf is already applied (docs/ops/public-api.md step 1):
#   - the `budget_public` limit_req_zone exists at http level (keyed on $budget_limit_key, so CORS
#     preflights are exempt), and
#   - the api.ai-budget.pl server already has `location /public/` and `location /oauth/`.
# `location /oauth/` already covers POST /oauth/register (dynamic client registration), so this file
# does NOT add a block for it. Check: `grep -n 'location /oauth/' /opt/shared-nginx/conf.d/ai-budget.conf`.
# If that block is missing, apply api-public.conf first rather than adding /oauth/register here.
#
# WHERE: inside the `server { server_name api.ai-budget.pl; ... }` block, next to `location /public/`,
# above the catch-all `location /`.
#
# PROXY LINES: the ones below are an ILLUSTRATION. Copy the live `location /public/` block's lines
# exactly (`grep -n -A15 'location /public/' /opt/shared-nginx/conf.d/ai-budget.conf`): proxy_pass and
# its upstream form, the `resolver` line if proxy_pass uses a variable, every proxy_set_header,
# proxy_*_timeout, proxy_buffering. Keep from here only the limit_req and client_max_body_size lines.
# X-Forwarded-For MUST be `$proxy_add_x_forwarded_for`: the API trusts exactly one proxy hop and
# counts the 10-registrations-per-hour limit on the address nginx appends. Without it every client
# shares one bucket.
#
# CORS: do NOT add CORS headers here. The API answers these paths itself with `*` (no credentials),
# preflight included; a second set of headers from nginx would break browsers.
# The 429 error_page (@budget_throttled, docs/ops/api-rate-limit.md) is inherited from the server
# level; its CORS headers name only our own origins. Assistant platforms call /mcp server-to-server,
# so that does not affect them.

# --- /mcp: the MCP endpoint (POST only; GET/DELETE answer 405 from the API) -------------------------
# Exact match: nothing else lives under /mcp. NOTE the trailing slash: `/mcp/` (or `/mcp/anything`)
# does NOT match this block and falls to the catch-all `location /` (zone budget_api, 10 MB body
# cap), where the API answers 404 — the resource identifier is `https://api.ai-budget.pl/mcp` with
# no slash, and a client that appends one is misconfigured. Do not "fix" this with `location /mcp/`:
# that would put an unknown path on the small-body public zone for nothing. The API caps the JSON body at 128 KB and answers a
# JSON-RPC-shaped 413; nginx's cap sits a little above it so the API's answer is the one clients see,
# and anything far larger is cut off at the edge before it is buffered.
location = /mcp {
    limit_req zone=budget_public burst=200 nodelay;
    client_max_body_size 256k;
    set $upstream_budget_api http://budget-api-prod:3000;
    proxy_pass $upstream_budget_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- /.well-known/oauth-*: discovery documents ---------------------------------------------------
# Covers /.well-known/oauth-authorization-server, /.well-known/oauth-protected-resource and
# /.well-known/oauth-protected-resource/mcp (GET only, small JSON).
#
# ORDERING vs ACME: an ACME block (`location /.well-known/acme-challenge/` or `location ^~ ...`) keeps
# its path: nginx picks the LONGEST matching prefix, and `/.well-known/oauth-` and
# `/.well-known/acme-challenge/` never match the same URI, so neither can steal the other's requests,
# whatever their order in the file. `^~` makes this prefix final, so a regex location such as a
# dotfile deny (`location ~ /\. { deny all; }`) cannot catch these paths. Before applying, list the
# existing ones: `grep -n 'well-known\|location ~' /opt/shared-nginx/conf.d/ai-budget.conf`, and after
# reload re-check a certificate renewal dry run if the box renews through this server block.
location ^~ /.well-known/oauth- {
    limit_req zone=budget_public burst=200 nodelay;
    client_max_body_size 16k;
    set $upstream_budget_api http://budget-api-prod:3000;
    proxy_pass $upstream_budget_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

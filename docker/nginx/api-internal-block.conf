# Block the API's container-to-container endpoints from the public internet (ABA-644).
#
# The inbound-mail SMTP container calls http://api:3000/api/v1/internal/inbound-mail/{rcpt,messages}
# over the private `inbound-mail-net` network; nothing public may ever reach /api/v1/internal/.
# Two independent layers protect it: this nginx 404, and the API itself, which answers 403 to any
# request carrying X-Forwarded-For / X-Real-IP (which nginx adds to every proxied request) and
# compares the X-Inbound-Secret header in constant time.
#
# THIS FILE IS NOT DEPLOYED BY CI. shared-nginx's config lives on the VPS
# (/opt/shared-nginx/conf.d/ai-budget.conf), outside this repo. Apply by hand:
#   1. cp /opt/shared-nginx/conf.d/ai-budget.conf /opt/shared-nginx/conf.d/ai-budget.conf.bak.$(date +%F)
#   2. paste the `location` block below INSIDE the `server { server_name api.ai-budget.pl; ... }`
#      block, ABOVE the generic `location /`. It is a CASE-INSENSITIVE regex on purpose: nginx
#      prefix locations are case-sensitive, and the API's router is not (Express answers
#      /api/v1/INTERNAL/... as /internal/...), so a case-sensitive block is bypassed by changing
#      one letter. Regex locations are evaluated in file order: keep this above any other regex
#      location that could match /api/v1/.
#   3. docker exec shared-nginx nginx -t && docker exec shared-nginx nginx -s reload
#      (graceful reload, NEVER recreate shared-nginx: it serves every site on the box)
#   4. verify FROM OUTSIDE the VPS (your laptop), all three:
#              curl -s -o /dev/null -w '%{http_code}\n' -X POST https://api.ai-budget.pl/api/v1/internal/inbound-mail/rcpt   -> 404
#              curl -s -o /dev/null -w '%{http_code}\n' -X POST https://api.ai-budget.pl/api/v1/INTERNAL/inbound-mail/rcpt   -> 404
#              curl -s -o /dev/null -w '%{http_code}\n' https://api.ai-budget.pl/api/v1/health                              -> 200
#              (a 401/403 on either of the first two means the block is NOT active: the request reached the API)

location ~* ^/api/v1/internal/ {
    return 404;
}

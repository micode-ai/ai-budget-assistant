# Public API + OAuth platform: rate-limit zone and clickjacking headers (Public API phase 1, Task 16).
#
# THIS FILE IS NOT DEPLOYED BY CI. shared-nginx's config lives on the VPS (outside this repo).
# It has THREE parts, pasted into three different places. Runbook with apply/verify/rollback:
# docs/ops/public-api.md. Apply in a window: back up first, `docker exec shared-nginx nginx -t`,
# then reload (see docs/ops/api-rate-limit.md "Applying a change": nginx.conf is a single-file bind
# mount, so no `sed -i`, and a reload may not cycle the workers).
#
# --- PART 1: http level (/opt/shared-nginx/nginx.conf, next to budget_api) -----------------------
# A separate zone from budget_api (30r/s): third-party integrations must not eat the web app's
# budget, and the web app must not eat theirs. NOTE: AI Accounting runs on the SAME VPS, so it
# reaches us from one IP and is the first verified app. Its whole traffic shares this one key.
# 50r/s + burst 200 is a flood backstop only; the real per-grant / per-client limits are enforced
# by the API (120/1,200 per min, verified apps 600/10,000).
# Keyed on $budget_limit_key (the map from docs/ops/api-rate-limit.md, already in nginx.conf): it is
# $binary_remote_addr for every method except OPTIONS, whose empty key makes limit_req skip CORS
# preflights. Declare this zone AFTER that map.

limit_req_zone $budget_limit_key zone=budget_public:10m rate=50r/s;

# --- PART 2: api.ai-budget.pl server block, ABOVE `location /` -----------------------------------
# The proxy lines below are an ILLUSTRATION. Before pasting, COPY the live `location /` block's proxy
# lines exactly (`grep -n -A30 'location / ' /opt/shared-nginx/conf.d/ai-budget.conf`): proxy_pass
# and its upstream form, any `resolver` line (required when proxy_pass uses a variable), every
# proxy_set_header, proxy_*_timeout, proxy_buffering / client_max_body_size. Keep only the
# limit_req line from here. A mismatch makes /public/ behave differently from /api/v1 in ways no
# test here will catch.
# /public/* and /oauth/token|revoke are excluded from the API's /api/v1 prefix, so no rewrite.
# (/api/v1/oauth/authorize/* stays on budget_api.)
# The 429 error_page from api-rate-limit.md (@budget_throttled) is inherited from the server level.
# Its CORS headers echo $budget_cors_origin, i.e. ONLY our own origins (app.ai-budget.pl,
# ai-budget.pl): a browser client on a third-party origin gets a 429 it cannot read (it surfaces
# as a network/CORS error). Server-side integrations are unaffected.

location /public/ {
    limit_req zone=budget_public burst=200 nodelay;
    set $upstream_budget_api http://budget-api-prod:3000;
    proxy_pass $upstream_budget_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /oauth/ {
    limit_req zone=budget_public burst=200 nodelay;
    set $upstream_budget_api http://budget-api-prod:3000;
    proxy_pass $upstream_budget_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- PART 3: app.ai-budget.pl server block: anti-clickjacking for the WHOLE host (Ruling 25) ------
# The consent page (/authorize) must never be framed, and the SPA has no reason to be framed
# anywhere. Put these at SERVER level.
#
# TRAP: `add_header` is inherited only if the current level defines NONE of its own. The block
# already has `add_header X-Robots-Tag "noindex, nofollow" always;` (web-build-and-hosting.md) --
# if that line is at server level, put these three together with it and you are done. If any
# `location` in the block has its own add_header (e.g. a cache-control one for static assets),
# that location silently DROPS these two, so repeat both lines there. Check with:
#   grep -n add_header /opt/shared-nginx/conf.d/<app block file>
# and verify with curl -I on /authorize AND on an asset path (runbook).

add_header X-Robots-Tag "noindex, nofollow" always;   # already present on the VPS; keep ONE copy
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

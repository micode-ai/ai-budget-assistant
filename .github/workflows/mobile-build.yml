name: Mobile Build & Publish

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - preview
          - production
      submit:
        description: 'Submit to Google Play after build'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    # Build is ~35 min; waiting on the submission adds a few more.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `eas-version: latest` now resolves an eas-cli whose
          # @oclif/plugin-autocomplete dependency declares engines.node >=22, and
          # yarn refuses to install it on 20 — the CLI install step fails before a
          # build is even attempted. Raising the pin follows the tool; leaving it
          # would mean pinning eas-version instead and freezing the CLI.
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        # android-actions/setup-android@v3 is unusable here: its `packages`
        # input defaults to the removed `tools` package, and any custom value
        # is passed to sdkmanager verbatim (spaces/newlines included), so both
        # the inline and the multi-line forms fail with
        # `Failed to find package '...'`. The ubuntu runner already ships
        # cmdline-tools at $ANDROID_SDK_ROOT, so install what's needed
        # directly: platform-tools + the platform and build-tools matching
        # this project's compileSdk/targetSdk (Expo SDK 54 → 35).
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check release version
        # Bare project: Google Play shows android/app/build.gradle versionName,
        # not app.json. Fail fast if they drifted (or the version wasn't bumped
        # above the latest release tag) so we never ship 1.0.0 by accident.
        if: inputs.profile == 'production'
        working-directory: apps/mobile
        run: node scripts/check-release-version.js

      - name: Resolve output artifact
        # `preview` is internal distribution and builds an APK, which is the
        # only Android artifact a tester can actually install; `production`
        # builds the AAB Play requires. The extension is not cosmetic — Android
        # refuses to install a file that is not named .apk.
        id: out
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            echo "file=app-release.aab" >> "$GITHUB_OUTPUT"
          else
            echo "file=app-release.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build locally
        # GOOGLE_SERVICES_JSON is consumed by `eas-build-pre-install` (see
        # apps/mobile/scripts/write-google-services.js). The hook runs inside
        # EAS's build workdir AFTER archive extraction and BEFORE Gradle, so
        # the file lands at android/app/google-services.json without ever
        # touching the repo or the runner's tracked workspace.
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: eas build --platform android --profile ${{ inputs.profile }} --local --non-interactive --output ./${{ steps.out.outputs.file }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.profile }}
          path: apps/mobile/${{ steps.out.outputs.file }}
          retention-days: 30

      - name: Write Google Play service account key
        if: inputs.submit && inputs.profile == 'production'
        working-directory: apps/mobile
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}' > google-play-service-account.json

      - name: Submit to Google Play
        if: inputs.submit && inputs.profile == 'production'
        working-directory: apps/mobile
        # No `--no-wait`, deliberately. Scheduling a submission and reporting
        # success is not the same as Play accepting it: the upload happens
        # asynchronously on EAS, and the failure mode this project has actually
        # hit — Play refusing the track update over the foreground-service
        # declaration — occurs entirely in that later stage. With --no-wait the
        # run went green while 1.18.0 never reached a single user, and nobody
        # noticed for thirteen days. Waiting costs a few minutes and makes a
        # green run mean the release shipped.
        run: eas submit --platform android --profile production --path ./app-release.aab --non-interactive

      - name: Clean up service account key
        if: always() && inputs.submit && inputs.profile == 'production'
        working-directory: apps/mobile
        run: rm -f google-play-service-account.json

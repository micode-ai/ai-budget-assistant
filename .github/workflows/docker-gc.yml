name: Docker GC

# Reclaims Docker disk on the prod VPS weekly. The same prune commands live in
# scripts/deploy.sh, but deploy.yml is path-filtered, so a stretch of
# mobile/marketing/docs-only work leaves the BuildKit cache growing untouched —
# which is exactly how / reached 88% on 2026-08-24 and tripped infra-watch twice.
#
# Runs before the Sunday backup (backup-db.yml, 02:00 UTC) so the dump is written
# to a disk that has just been cleaned.
on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

concurrency:
  group: docker-gc
  cancel-in-progress: false

jobs:
  gc:
    name: Reclaim docker disk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for script)
        uses: actions/checkout@v5

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_gc
          chmod 600 ~/.ssh/id_gc

      - name: Prune over SSH
        id: gc
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set +e
          OUT=$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i ~/.ssh/id_gc \
            "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/docker-gc.sh 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "code=$CODE"
            echo "summary<<EOF"
            echo "$OUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # Only alerts when cleanup could NOT get the disk under control — a normal
      # weekly reclaim is silent, like a successful backup.
      - name: Notify Telegram if still full
        if: steps.gc.outputs.code != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.gc.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret missing — cannot alert" >&2
            exit 1
          fi
          MESSAGE=$(printf $'*[AI Budget]* \xF0\x9F\xA7\xB9 *DOCKER GC DID NOT FREE ENOUGH* \xF0\x9F\xA7\xB9\n\n```\n%s\n```\n\n[GitHub run](%s)' "$SUMMARY" "$RUN_URL")
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"

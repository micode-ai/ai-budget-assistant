name: Deploy Web to VPS

on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build & deploy static web app
    runs-on: ubuntu-latest
    environment: production
    env:
      # IndexNow ownership key (public by design — served at /<key>.txt). Stable.
      INDEXNOW_KEY: a7f3d9c1e5b84206f9c2a7e14d8b6035

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the IndexNow step can diff the push range

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          # Baked into the bundle at build time — the web app talks to prod API.
          EXPO_PUBLIC_API_URL: https://api.ai-budget.pl/api/v1
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 587710971480-l2noql6vqb8bikcfc0ef3juom9h51gbi.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 587710971480-2sc9b42b8f6tbq9ee9pat3ivc24nt7kd.apps.googleusercontent.com
        run: bash scripts/build-web.sh

      - name: Verify build output
        run: |
          set -e
          test -f apps/mobile/dist/index.html || { echo "::error::dist/index.html missing — aborting before deploy"; exit 1; }
          ls apps/mobile/dist/_expo/static/js/web/*.js >/dev/null 2>&1 || { echo "::error::no JS bundle in dist — aborting"; exit 1; }
          echo "dist OK: $(du -sh apps/mobile/dist | cut -f1)"

      - name: Assemble apex tree (landing + blog + help)
        run: |
          set -e
          # apex ai-budget.pl = static marketing landing (9 langs, indexable) + /blog (ABA-269) + /help (ABA-284).
          # Committed builds (regenerate then commit) — order matters: blog + help BEFORE landing,
          # because the apex sitemap.xml emitted by build_landing.py reads the blog + help sitemaps:
          #   blog:         python docs/marketing/seo/build_blog.py
          #   help:         python docs/marketing/help/build_help.py
          #   landing apex: LANDING_BASE= ROBOTS="index,follow,max-image-preview:large" python docs/marketing/landing/build_landing.py
          rm -rf apex && mkdir -p apex
          cp -r docs/marketing/landing/site/. apex/
          cp -r docs/marketing/seo/site/blog apex/blog
          cp -r docs/marketing/help/site/help apex/help
          # Android app-links / Credential Manager verification (ABA-464) —
          # binds com.budget.assistant to rp.id = ai-budget.pl. Source of truth
          # is docs/ops/assetlinks.json (see docs/ops/restore-credentials-rollout.md).
          mkdir -p apex/.well-known
          cp docs/ops/assetlinks.json apex/.well-known/assetlinks.json
          test -f apex/index.html       || { echo "::error::landing index.html missing"; exit 1; }
          test -f apex/blog/index.html  || { echo "::error::blog/index.html missing"; exit 1; }
          test -f apex/help/en/index.html || { echo "::error::help/en/index.html missing"; exit 1; }
          test -f apex/sitemap.xml      || { echo "::error::sitemap.xml missing"; exit 1; }
          test -f apex/.well-known/assetlinks.json || { echo "::error::assetlinks.json missing"; exit 1; }
          if grep -q 'REPLACE_WITH_' apex/.well-known/assetlinks.json; then
            echo "::error::docs/ops/assetlinks.json still has an unfilled REPLACE_WITH_* placeholder — fill in the real SHA-256 fingerprint(s) before this can deploy"
            exit 1
          fi
          # IndexNow ownership key file, served at https://ai-budget.pl/<key>.txt
          printf '%s' "$INDEXNOW_KEY" > "apex/${INDEXNOW_KEY}.txt"
          echo "apex tree: $(du -sh apex | cut -f1)"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy app (SPA) to app.ai-budget.pl
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            apps/mobile/dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/ai-budget-app/html/"

      - name: Deploy apex (landing + blog + help) to ai-budget.pl
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            apex/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/ai-budget-web/html/"

      - name: Verify sites are live
        run: |
          set -e
          check() {
            for i in $(seq 1 10); do
              code=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 8 "$1" || echo "000")
              [ "$code" = "200" ] && { echo "$1 -> OK ($code)"; return 0; }
              echo "  ($i/10) $1 -> $code, retry in 3s..."; sleep 3
            done
            echo "::error::$1 did not return 200 after deploy"; return 1
          }
          check https://ai-budget.pl/
          check https://ai-budget.pl/blog/
          check https://ai-budget.pl/help/en/
          check https://app.ai-budget.pl/

      # Notify IndexNow (Bing/Yandex/Seznam) about the pages that changed in this
      # push, so new/updated blog + landing + help URLs get discovered fast.
      # Non-fatal: IndexNow issues warn, never fail the deploy.
      - name: IndexNow ping (changed pages)
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${BEFORE}..${{ github.sha }}"
          fi
          echo "IndexNow range: $RANGE"
          bash scripts/indexnow-ping.sh "$RANGE"

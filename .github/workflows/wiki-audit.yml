name: Wiki Audit

# The machine-checkable half of the wiki lint. Deliberately contains no LLM
# call: this project runs Claude Code on a subscription, so there is no API key
# to put in CI, and a job that needs one would simply never run. What a plain
# Python script can know for certain runs here every week; the semantic half --
# contradictions between pages, missing cross-references, data gaps -- is the
# `wiki-audit` skill, run inside a session where the model is already paid for.
#
# This never fails the build. A page being a week behind must not block a merge;
# the output is a report someone reads.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # staleness compares commit dates; a shallow clone has none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the wiki lint
        id: lint
        run: |
          set +e
          python scripts/wiki-lint.py > lint.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat lint.txt

      - name: Report which pages the code has moved past
        run: python scripts/wiki-staleness.py > staleness.md 2>&1 || true

      - name: Assemble the report
        run: |
          {
            echo "_Generated by \`wiki-audit.yml\`. Machine-checkable findings only —"
            echo "run the \`wiki-audit\` skill in a session for the reading pass._"
            echo
            echo '## Lint'
            echo
            echo '```'
            cat lint.txt
            echo '```'
            echo
            cat staleness.md
          } > report.md
          cat report.md

      - name: File or update the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Wiki audit"
          # One long-lived issue, updated in place. A new issue every week would bury
          # the repo in near-identical reports nobody reads.
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
                  -q ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file report.md
            echo "commented on #$NUM"
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi
